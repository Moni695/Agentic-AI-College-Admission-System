<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Overview · Bangalore University</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3 py-3">
    <a class="navbar-brand fw-bold" href="index.html">Bangalore University <span>AdmitAI</span></a>
    <div class="navbar-nav ms-auto" id="navLinks"></div>
  </nav>
  <main>
    <section id="admin-auth" class="view active container narrow py-5">
      <div class="card-panel">
        <p class="eyebrow">ADMIN PORTAL</p>
        <h2>Administrator sign in</h2>
        <p class="muted">Use the seeded project administrator account.</p>
        <form id="adminLogin">
          <label>Email</label>
          <input class="form-control" type="email" name="email" required>
          <label>Password</label>
          <input class="form-control" type="password" name="password" required>
          <button class="btn btn-primary mt-2">Admin login</button>
        </form>
        <p id="adminAuthMessage" class="form-message"></p>
      </div>
    </section>
    <section id="admin-dashboard" class="view container py-5">
      <p class="eyebrow">ADMIN PORTAL</p>
      <h2>Admissions control centre</h2>
      <p class="muted">Choose a section below. Every section opens on its own page.</p>
      <div id="adminPageNavigation" class="d-flex flex-wrap gap-2 mb-4"></div>
      <div id="adminStats" class="row g-3"></div>
    </section>
  </main>
  <div id="toast" class="toast-box"></div>
  <script src="js/app.js?v=admin-pages-2"></script>
</body>
</html>
<script src="js/password-toggle.js?v=2"></script>
